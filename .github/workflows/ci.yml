name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r services/api/requirements-dev.txt
      - run: pytest -q
      - name: E2E de navegador (mídia sintética, sem câmeras)
        run: |
          npm --prefix e2e install && npx --prefix e2e playwright install --with-deps chromium
          PY=$(which python) NODE_PATH=$PWD/e2e/node_modules scripts/e2e.sh
  docker_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker, Compose e smoke HTTP isolados
        env:
          RUN_DOCKER_HOMOLOGACAO: SIM
        run: bash scripts/docker-smoke.sh
